#
# CI 必須ゲート。全 PR がこれを通過しなければマージできない(roadmap M2 完了条件 #1)。
# 最重要は「読込 → 無編集 → 書出 → バイト一致」黄金テスト(architecture §7.1)。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一 PR/ブランチの古い実行はキャンセルして最新のみ走らせる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 品質ゲート(typecheck / lint / test / format)
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存インストール(ロックファイル固定)
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: Lint(ESLint + 依存方向)
        run: pnpm lint

      - name: フォーマット検査
        run: pnpm format:check

      # 黄金テストを含む全テスト。バイト一致ゲートはここで強制される。
      - name: テスト(バイト一致黄金テスト含む)
        run: pnpm test

  e2e:
    name: E2E(Playwright / Chromium・タブモード)
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存インストール(ロックファイル固定)
        run: pnpm install --frozen-lockfile

      # Chromium + OS 依存ライブラリを導入(--with-deps)。
      - name: Playwright ブラウザ導入
        run: pnpm --filter @oudia/web e2e:install

      - name: E2E 実行
        run: pnpm e2e

      - name: レポート添付(失敗時)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  license-check:
    name: ライセンス検査(GPLv3 非互換依存の混入防止)
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: pnpm セットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存インストール(ロックファイル固定)
        run: pnpm install --frozen-lockfile

      - name: ライセンス検査
        run: pnpm license-check
